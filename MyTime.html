<style>
:root{
  /* esther 三色 + 暖底 设计令牌 */
  --primary:#2B7FD8;
  --accent:#F4D758;
  --pop:#E84A5F;
  --bg:#FBF7F0;
  --panel:#FFFDF8;
  --panel-2:#F4ECDD;
  --text:#2B2A28;
  --text-soft:#7A7268;
  --line:#EBE1D0;
  --line-strong:#DCCFB8;
  --shadow:0 8px 24px rgba(43,127,216,.10);
  --shadow-sm:0 2px 8px rgba(43,127,216,.08);
  --radius:14px;
  --radius-sm:10px;
  --font-serif:"Noto Serif SC","Songti SC",serif;
  --font-sans:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-deco:"Fraunces","Noto Serif SC",serif;
  --font-hand:"Caveat","Noto Sans SC",cursive;
  --H:52px; /* 每小时像素高 */
}
[data-theme="dark"]{
  --bg:#1F1B17;
  --panel:#2A2520;
  --panel-2:#332D26;
  --text:#F2EAE0;
  --text-soft:#B3A994;
  --line:#3B342C;
  --line-strong:#4A4136;
  --primary:#6FB0F0;
  --accent:#E9C84B;
  --pop:#F07688;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:
    radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb,var(--accent) 12%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb,var(--primary) 10%, transparent), transparent 55%),
    var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}

/* ===== 布局 ===== */
.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
#side{
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:18px 16px;
  display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;
}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 20px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 85%, transparent);
  backdrop-filter:blur(6px);
}
.viewswitch{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:999px}
.viewswitch button{
  padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--text-soft);
  transition:.18s;
}
.viewswitch button.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
.viewswitch button:hover:not(.active){color:var(--text)}
.nav{display:flex;align-items:center;gap:6px}
.nav .title{font-family:var(--font-serif);font-weight:700;font-size:clamp(17px,2.4vw,22px);min-width:150px;text-align:center}
.iconbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:var(--panel-2);font-size:16px;color:var(--text);transition:.15s;
}
.iconbtn:hover{background:var(--line-strong)}
.iconbtn[data-state="granted"]{background:#22c55e22;color:#22c55e;border:1px solid #22c55e44}
.iconbtn[data-state="denied"]{background:#e84a5f22;color:#e84a5f;border:1px solid #e84a5f44}
.iconbtn[data-state="granted"]:hover{background:#22c55e33}
.iconbtn[data-state="denied"]:hover{background:#e84a5f33}
#todayBtn{padding:7px 14px;border-radius:10px;background:var(--accent);color:#3a2f00;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-sm)}
.today:hover{filter:brightness(1.04)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:999px;padding:6px 12px;min-width:160px}
.search input{background:none;border:none;outline:none;font-size:13.5px;width:100%}
.search input::placeholder{color:var(--text-soft)}
.top-actions{display:flex;gap:6px}

/* ===== 侧栏 ===== */
.minical{background:var(--panel-2);border-radius:var(--radius);padding:14px;overflow:hidden}
.minical .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.minical .mc-title{font-family:var(--font-serif);font-weight:700;font-size:15px}
.minical .mc-nav{display:flex;gap:4px}
.minical .mc-nav button{width:26px;height:26px;border-radius:8px;background:var(--panel);font-size:13px}
.minical .mc-nav button:hover{background:var(--line-strong)}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc-grid .mc-wd{font-size:11px;color:var(--text-soft);text-align:center;padding:2px 0;font-weight:500}
.mc-cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:11.5px;line-height:1;
  border-radius:8px;color:var(--text);position:relative;transition:.12s;overflow:hidden;min-width:0
}
.mc-cell.out{color:var(--text-soft);opacity:.5}
.mc-cell:hover{background:var(--panel)}
.mc-cell.today{color:#3a2f00;font-weight:600}
.mc-cell.today::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1.7em;height:1.7em;background:var(--accent);border-radius:50%;z-index:-1
}
.mc-cell.has::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--primary);z-index:1}
.mc-cell.today.has::after{display:none}
.mc-cell.selected:not(.today){background:var(--line-strong);color:var(--text-soft)}
.mc-cell.selected{background:var(--line-strong)}

.sect-title{font-family:var(--font-serif);font-weight:700;font-size:14px;color:var(--text-soft);margin:2px 2px 6px;display:flex;align-items:center;justify-content:space-between}
.sect-title .add-cat{font-size:18px;color:var(--primary);line-height:1}
.catlist{display:flex;flex-direction:column;gap:4px}
.catitem{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;font-size:13.5px;cursor:pointer;transition:.12s}
.catitem:hover{background:var(--panel-2)}
.catitem .swatch{width:14px;height:14px;border-radius:5px;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line-strong)}
.catitem.off{opacity:.4}
.catitem .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catitem .del-cat{flex:none;width:18px;height:18px;line-height:16px;text-align:center;border-radius:6px;color:var(--text-soft);opacity:0;transition:.12s;font-size:15px}
.catitem:hover .del-cat{opacity:1}
.catitem .del-cat:hover{background:var(--pop);color:#fff}
.newbtn{
  margin-top:auto;padding:11px;border-radius:12px;background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:var(--shadow);transition:.15s;
}
.newbtn:hover{filter:brightness(1.05)}
/* 看板模块侧栏：更克制的新建按钮 */
.side-kan .newbtn{margin-top:8px;padding:8px 11px;border-radius:10px;font-size:12.5px;background:color-mix(in srgb,var(--primary) 12%,var(--panel-2));color:var(--primary);border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);box-shadow:none}
.side-kan .newbtn:hover{background:color-mix(in srgb,var(--primary) 18%,var(--panel-2))}
/* 看板分类分组 */
.kb-cat{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.kb-cat-head{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--text-soft);font-size:12.5px;font-weight:600;transition:.12s}
.kb-cat-head:hover{background:var(--panel-2);color:var(--text)}
.kb-cat-head.on{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.kb-cat-head .tri{width:10px;height:10px;transition:.15s;flex:none}
.kb-cat-head.collapsed .tri{transform:rotate(-90deg)}
.kb-cat-head .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-cat-head .del{opacity:0;width:18px;height:18px;border-radius:6px;color:var(--text-soft);line-height:16px;text-align:center;transition:.12s}
.kb-cat-head:hover .del{opacity:1}
.kb-cat-head .del:hover{background:var(--pop);color:#fff}
.kb-cat-body{display:flex;flex-direction:column;gap:3px;padding-left:14px}
.kb-cat-body.collapsed{display:none}

/* ===== 主视图区 ===== */
#view{flex:1;overflow:auto;padding:16px 20px 28px}
.empty-hint{font-family:var(--font-hand);font-size:26px;color:var(--text-soft);text-align:center;margin-top:40px;line-height:1.5}

/* 月视图 */
.month-head{display:grid;grid-template-columns:repeat(7,1fr);position:sticky;top:0;background:var(--bg);z-index:2}
.month-head .wd{text-align:center;font-size:13px;color:var(--text-soft);font-weight:500;padding:6px 0;border-bottom:1px solid var(--line)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.cell{
  min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:6px 6px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .12s;position:relative;
}
.cell:nth-child(7n){border-right:none}
.cell:nth-child(n+36){border-bottom:none}
.cell.out{background:color-mix(in srgb,var(--panel-2) 55%, transparent)}
.cell:hover{background:color-mix(in srgb,var(--primary) 6%, transparent)}
.cell.today{background:color-mix(in srgb,var(--accent) 22%, transparent)}
.cell.today .dnum{background:var(--accent);color:#3a2f00}
.dnum{align-self:flex-start;font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.evs{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.event{
  display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 7px;border-radius:7px;
  background:color-mix(in srgb,var(--c) 16%, var(--panel));
  border-left:3px solid var(--c);color:var(--text);cursor:pointer;overflow:hidden;white-space:nowrap;
}
.event .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.event .tt{overflow:hidden;text-overflow:ellipsis}
.event.allday{background:var(--c);color:#fff;border-left:none}
.event.allday .dot{background:#fff}
.more{font-size:11.5px;color:var(--primary);font-weight:600;padding:1px 7px;cursor:pointer}
.event.dragging{opacity:.25}

/* 周/日 时间网格 */
.timegrid{display:grid;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);min-width:680px}
.tg-axis{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel-2)}
.tg-axis .alabel{height:var(--H);font-size:11px;color:var(--text-soft);text-align:right;padding:2px 6px 0 0;position:relative}
.tg-colhead{display:flex}
.dayhead{flex:1;text-align:center;padding:8px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.dayhead:last-child{border-right:none}
.dayhead .dh-d{font-family:var(--font-serif);font-size:18px;font-weight:700}
.dayhead .dh-w{font-size:11px;color:var(--text-soft)}
.dayhead.today{background:color-mix(in srgb,var(--accent) 22%, transparent)}
.dayhead.today .dh-d{color:#3a2f00}
.tg-body{display:flex;position:relative}
.tg-axis-body{display:flex;flex-direction:column;width:54px;flex:none;border-right:1px solid var(--line);background:var(--panel-2)}
.tg-axis-body .ah{height:var(--H);border-bottom:1px solid var(--line);position:relative}
.tg-axis-body .ah span{position:absolute;top:-7px;right:6px;font-size:10.5px;color:var(--text-soft)}
.daycol{flex:1;position:relative;border-right:1px solid var(--line)}
.daycol:last-child{border-right:none}
.hourlines{position:absolute;inset:0;pointer-events:none}
.hourlines .hl{height:var(--H);border-bottom:1px solid var(--line)}
.evlayer{position:absolute;inset:0}
.tevent{
  position:absolute;border-radius:8px;padding:3px 7px;overflow:hidden;cursor:grab;
  background:color-mix(in srgb,var(--c) 20%, var(--panel));
  border-left:3px solid var(--c);box-shadow:var(--shadow-sm);font-size:12px;
}
.tevent .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tevent .tm{font-size:10.5px;color:var(--text-soft)}
.tevent:active{cursor:grabbing}
.rgrip{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.rgrip:hover{background:color-mix(in srgb,var(--c) 40%, transparent)}
/* 零时长事件：渲染成「时间点」胶囊，左侧圆点，无缩放手柄 */
.tevent.punctual{border-radius:999px;border-left:none;padding-left:20px;background:color-mix(in srgb,var(--c) 14%, var(--panel))}
.tevent.punctual::before{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%, transparent)}
.tevent.punctual .tt{font-weight:500}
/* 事件上提醒铃铛标记 */
.ag-bell{flex:none;width:12px;height:12px;margin-left:4px;opacity:.7;color:var(--pop)}
.ag-item .ag-bell{width:13px;height:13px;margin-left:6px;align-self:center}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--pop);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--pop)}
.allday-row{display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.allday-row .ad-label{width:54px;flex:none;font-size:10.5px;color:var(--text-soft);display:grid;place-items:center;border-right:1px solid var(--line)}
.allday-row .ad-cells{flex:1;display:flex}
.ad-cell{flex:1;border-right:1px solid var(--line);min-height:26px;padding:2px}
.ad-cell:last-child{border-right:none}
.ad-event{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--c);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

/* 年视图 */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.ym{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);overflow:hidden}
.ym .ym-t{font-family:var(--font-serif);font-weight:700;font-size:15px;text-align:center;margin-bottom:8px}
.ym-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym-wd{font-size:10px;color:var(--text-soft);text-align:center;padding:1px 0}
.ym-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:10.5px;line-height:1;border-radius:6px;position:relative;overflow:hidden;min-width:0}
.ym-cell.out{color:var(--text-soft);opacity:.45}
.ym-cell.today{color:#3a2f00;font-weight:600}
.ym-cell.today::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1.7em;height:1.7em;background:var(--accent);border-radius:50%;z-index:-1
}
.ym-cell.has::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--primary);z-index:1}
.ym-cell.today.has::after{display:none}
.ym-cell.selected:not(.today){background:var(--panel-2)}
.ym-cell{cursor:pointer}
.ym-cell:hover{background:var(--panel-2)}

/* 议程视图 */
.agenda{display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto}
.ag-day{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.ag-day .ag-head{display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ag-day .ag-date{font-family:var(--font-serif);font-weight:700;font-size:16px}
.ag-day .ag-week{font-size:12px;color:var(--text-soft)}
.ag-day .ag-count{margin-left:auto;font-size:12px;color:var(--text-soft)}
.ag-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ag-item:last-child{border-bottom:none}
.ag-item:hover{background:color-mix(in srgb,var(--primary) 5%, transparent)}
.ag-item .ag-time{font-size:12.5px;color:var(--text-soft);width:104px;flex:none;font-variant-numeric:tabular-nums}
.ag-item .ag-dot{width:11px;height:11px;border-radius:4px;flex:none;background:var(--c)}
.ag-item .ag-tt{font-weight:500}
.ag-item .ag-loc{font-size:12px;color:var(--text-soft);margin-left:auto}

/* ===== 模态 ===== */
.overlay{position:fixed;inset:0;background:rgba(30,22,15,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:18px;padding:22px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{font-family:var(--font-serif);font-weight:700;font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal .row{margin-bottom:13px}
.modal label{display:block;font-size:12.5px;color:var(--text-soft);margin-bottom:5px;font-weight:500}
.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal select,.modal textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel-2);font-size:14px;outline:none;transition:.15s;
}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.modal textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.allday-toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--panel-2);color:var(--text)}
.btn.ghost:hover{background:var(--line-strong)}
.btn.danger{background:color-mix(in srgb,var(--pop) 14%,var(--panel));color:var(--pop)}
.btn.danger:hover{background:color-mix(in srgb,var(--pop) 22%,var(--panel))}
.cat-pick{display:flex;flex-wrap:wrap;gap:8px}

<script>
"use strict";
/* ============ 常量与工具 ============ */
const DAY=86400000;
const PXPERMIN=52/60;
const WK=["日","一","二","三","四","五","六"];
const MON=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ymd(ms){const x=new Date(ms);return [x.getFullYear(),x.getMonth(),x.getDate()];}
function dateOnly(ms){const [y,m,d]=ymd(ms);return new Date(y,m,d).getTime();}
function addDays(ms,n){return ms+n*DAY;}
function addMonths(ms,n){const x=new Date(ms);return new Date(x.getFullYear(),x.getMonth()+n,1).getTime();}
function sameDay(a,b){return dateOnly(a)===dateOnly(b);}
function minOfDay(ms){const x=new Date(ms);return x.getHours()*60+x.getMinutes();}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function shadeColor(hex,percent){
  const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=1+percent/100;
  const clamp=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  const R=clamp(r),G=clamp(g),B=clamp(b);
  return "#"+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);
}
function fmtTime(ms){const x=new Date(ms);return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0");}
function fmtDateHead(ms){const x=new Date(ms);return x.getFullYear()+"年"+(x.getMonth()+1)+"月"+x.getDate()+"日 · 周"+WK[x.getDay()];}
function toInputDate(ms){const x=new Date(ms);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function toInputTime(ms){return fmtTime(ms);}
function fromInputs(d,t){const [y,m,dd]=d.split("-").map(Number);const [hh,mm]=(t||"00:00").split(":").map(Number);return new Date(y,m-1,dd,hh||0,mm||0).getTime();}
function fromDateKey(k){const [y,m,dd]=k.split("-").map(Number);return new Date(y,m-1,dd).getTime();}

/* ============ 默认分类（esther 三色扩展） ============ */
const DEFAULT_CATS=[
  {id:"c1",name:"工作",color:"#2B7FD8"},
  {id:"c2",name:"生活",color:"#F4D758"},
  {id:"c3",name:"重要",color:"#E84A5F"},
  {id:"c4",name:"健康",color:"#5BBF8A"},
  {id:"c5",name:"学习",color:"#9B7FD8"},
  {id:"c6",name:"社交",color:"#F0995A"},
  {id:"c7",name:"财务",color:"#4FB8C4"},
  {id:"c8",name:"灵感",color:"#E88AB5"},
];
const CAT_PALETTE=["#2B7FD8","#F4D758","#E84A5F","#5BBF8A","#9B7FD8","#F0995A","#4FB8C4","#E88AB5","#B08968","#8C857B"];
const REMINDER_OPTIONS=[
  {v:0,label:"事件开始时"},
  {v:5,label:"提前5分钟"},
  {v:10,label:"提前10分钟"},
  {v:15,label:"提前15分钟"},
  {v:30,label:"提前30分钟"},
  {v:60,label:"提前1小时"},
  {v:1440,label:"提前1天"},
  {v:4320,label:"提前3天"},
  {v:10080,label:"提前1周"},
];
const DEFAULT_REMINDERS=[15];

/* ============ 状态与存储 ============ */
const LS_KEY="mytime.v1";

/* ============ Supabase 云同步（多设备共享数据） ============ */
/* 云端配置：默认留空，由用户首次打开时通过「配置云端同步」弹窗填写，仅存于本机 localStorage。
   开源版本不内置任何个人 Supabase 凭据；每个人用自己独立的项目，数据天然隔离、互不可见。 */
let SUPA_URL="";
let SUPA_KEY="";
const CFG_KEY="mytime_cfg";
function loadCfg(){
  try{
    const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");
    if(c&&c.url&&c.key){ SUPA_URL=c.url.trim(); SUPA_KEY=c.key.trim(); return true; }
  }catch(_){}
  return false;
}
function saveCfg(url,key){
  SUPA_URL=(url||"").trim(); SUPA_KEY=(key||"").trim();
  try{ localStorage.setItem(CFG_KEY,JSON.stringify({url:SUPA_URL,key:SUPA_KEY})); }catch(_){}
}
function cfgReady(){ return !!(SUPA_URL&&SUPA_KEY); }
let sbClient=null,_sbLoading=null;
function ensureSb(){
  if(sbClient)return Promise.resolve(sbClient);
  if(_sbLoading)return _sbLoading;
  _sbLoading=new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=()=>{ try{ sbClient=supabase.createClient(SUPA_URL,SUPA_KEY); }catch(e){ sbClient=null; } res(sbClient); };
    s.onerror=()=>res(null);
    document.head.appendChild(s);
  });
  return _sbLoading;
}
let state={
  module:"calendar",
  view:"month",
  cursor:Date.now(),
  theme:"light",
  events:[],
  cats:[...DEFAULT_CATS.map(c=>({...c}))],
  hiddenCats:new Set(),
  search:"",
  notified:{},
  habits:[],
  logs:{},
  habitYear:new Date().getFullYear(),
  kanban:{categories:[],boards:[],cur:null,undo:{},redo:{}},
  quicknotes:[]
};
function snapshot(){
  return {
    module:state.module,view:state.view,cursor:state.cursor,theme:state.theme,
    savedAt:Date.now(),
    events:state.events,cats:state.cats,hiddenCats:[...state.hiddenCats],
    notified:state.notified,habits:state.habits,logs:state.logs,habitYear:state.habitYear,
    kanban:state.kanban,quicknotes:state.quicknotes
  };
}
/* 同步核心规则：云端是单一真相，本地 localStorage 只是本机缓存。
   1) 打开网页：总是从云端拉取并覆盖本地缓存；本地缓存绝不反向写回云端，
      除非「本浏览器在本会话里真的改了东西」(_madeLocalEdit)。
   2) 本浏览器做编辑：标记 _madeLocalEdit=true，生成新时间戳，防抖推云。
   3) 轮询：云端比当前内存新→拉下来；本会话改了且比云端新→推上去(重试)。
   这样「某浏览器带着旧时间戳打开」永远不会覆盖云端真实最新数据。 */
let _currentSavedAt=0;     // 当前内存数据对应的 savedAt（拉云/推云成功后更新）
let _madeLocalEdit=false;  // 本次会话是否真做过编辑（尚未成功上云）
let _cloudBooted=false;    // 云端首次拉取是否已完成；未完成前绝不把本地(可能为空)推上云，避免清空共享行
let _cloudTimer=null;
let _pendingPush=null;
function save(){
  const snap=snapshot();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(snap)); }catch(e){}
  if(_cloudBooted){        // 关键：云端首次拉取完成前，绝不把本地(可能为空)推上云，避免清空共享行
    _currentSavedAt=snap.savedAt;
    _madeLocalEdit=true;   // 只有本会话真正编辑过，才允许后续推云
    snapToCloud(snap);
  }
}
function snapToCloud(snap){
  if(_cloudTimer)clearTimeout(_cloudTimer);
  _pendingPush=snap||_pendingPush;
  _cloudTimer=setTimeout(_doCloudPush,1500);
}
async function _doCloudPush(){
  await ensureSb(); if(!sbClient)return;
  const snap=_pendingPush; if(!snap)return;
  try{
    const {error}=await sbClient.from("mytime_data").upsert({id:1,payload:snap},{onConflict:"id"});
    if(error){console.warn("[MyTime] 推云失败:",error.message);return;}
    _currentSavedAt=snap.savedAt; // 推成功→确认云端已是最新
    _madeLocalEdit=false;        // 本地编辑已上云
    _pendingPush=null;
    console.log("[MyTime] 已推云 savedAt="+snap.savedAt);
  }
  catch(e){console.warn("[MyTime] 推云异常:",e&&e.message);}
}
async function loadCloud(){
  await ensureSb(); if(!sbClient)return;
  try{
    const {data,error}=await sbClient.from("mytime_data").select("payload").eq("id",1);
    if(error){console.warn("[MyTime] 云端读取失败:",error);return;}
    if(!data||!data.length){
      // 云端空：确认云端为空后，允许本机作为种子写入（首次使用）。绝不反向用本地覆盖云端。
      _cloudBooted=true;
      let local=null; try{local=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(_){}
      if(local){ snapToCloud(local); console.log("[MyTime] 云端为空，已用本地数据做种子"); }
      return;
    }
    const cloud=data[0].payload;
    const cloudSaved=cloud.savedAt||0;
    if(_userIsBusy())return; // 正在编辑：本轮不重绘，交给轮询稍后重试
    // 总是以云端为准：覆盖本地缓存，绝不把本地旧数据推回云端
    applyData(cloud);
    _cloudBooted=true;       // 云端数据已落地内存，之后本设备的真实编辑才允许上推
    _currentSavedAt=cloudSaved;
    _madeLocalEdit=false;
    try{localStorage.setItem(LS_KEY,JSON.stringify(cloud));}catch(_){}
    render();
    console.log("[MyTime] 已从云端拉取 savedAt="+cloudSaved);
    showToast("已从云端同步最新数据");
  }catch(e){console.warn("[MyTime] loadCloud 出错:",e);}
}
/* 用户正在编辑时不打扰：有弹窗打开或输入框聚焦时，跳过本轮同步（5 秒后重试），
   避免重绘打断输入 / 触发 innerHTML 的 NotFoundError 崩溃 */
function _userIsBusy(){
  if(document.querySelector(".overlay.show"))return true;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable))return true;
  return false;
}

/* ============ 首次云端配置弹窗（开源版：不内置个人凭据，用户填自己的 Supabase） ============ */
function showSetup(prefill){
  const ov=document.getElementById("setupOverlay");
  if(prefill){ document.getElementById("cfgUrl").value=SUPA_URL; document.getElementById("cfgKey").value=SUPA_KEY; }
  document.getElementById("cfgErr").textContent="";
  ov.classList.add("show");
  setTimeout(()=>{ const u=document.getElementById("cfgUrl"); if(u)u.focus(); },60);
}
function hideSetup(){ document.getElementById("setupOverlay").classList.remove("show"); }
function onCfgSave(){

  const key=(document.getElementById("cfgKey").value||"").trim();
  if(!url||!key){ document.getElementById("cfgErr").textContent="两项都需要填写。"; return; }
  saveCfg(url,key);
  hideSetup();

  loadCloud();
  startCloudPoll();
}
function onCfgCancel(){
  hideSetup();
  showToast("已使用本地模式：数据仅存本机。需要多设备同步时，点右上角 ☁ 配置");
}
/* 多设备自动同步：每 5 秒静默从云端拉一次；后台标签不拉，切回前台立即拉一次 */
let _pollTimer=null;
let _pollHidden=false;
function startCloudPoll(){
  if(_pollTimer)return;
  _pollTimer=setInterval(_cloudPollTick,5000);
  document.addEventListener("visibilitychange",_onVisChange);
}
function stopCloudPoll(){
  if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}
  document.removeEventListener("visibilitychange",_onVisChange);
}
function _onVisChange(){
  _pollHidden=document.hidden;
  if(!_pollHidden)_cloudPollTick(); // 切回前台：立即拉一次
}
async function _cloudPollTick(){
  if(_pollHidden||_userIsBusy())return;
  await ensureSb(); if(!sbClient)return;
  try{
    const {data,error}=await sbClient.from("mytime_data").select("payload").eq("id",1);
    if(error)return;
    _cloudBooted=true;       // 轮询成功读到云端状态：本设备后续真实编辑可正常上推（修复启动失败但后来联网的情况）
    if(!data||!data.length){
      // 云空且本会话改过：推上去做种子
      if(_madeLocalEdit){ let local=null; try{local=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(_){} if(local)snapToCloud(local); }
      return;
    }
    const cloud=data[0].payload;
    const cloudSaved=cloud.savedAt||0;
    if(cloudSaved>_currentSavedAt+100){
      // 云端更新：拉下来（写 cloud 原文保持时间戳一致）
      applyData(cloud);
      _currentSavedAt=cloudSaved;
      _madeLocalEdit=false;
      try{localStorage.setItem(LS_KEY,JSON.stringify(cloud));}catch(_){}
      render();
      console.log("[MyTime] 轮询拉云 savedAt="+cloudSaved);
      showToast("已从云端同步最新数据");
    }else if(_madeLocalEdit && _currentSavedAt>cloudSaved){
      // 本会话改了且确实比云端新：推上去（重试），不再因旧时间戳误推
      let local=null; try{local=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(_){}
      if(local){ snapToCloud(local); console.log("[MyTime] 本地编辑比云端新，自动推云 savedAt="+_currentSavedAt); }
    }
  }catch(e){}
}
function applyData(d){
  if(!d||typeof d!=="object")return;
  const mods=["calendar","heatmap","kanban","notes"];
  state.module=mods.includes(d.module)?d.module:"calendar";
  state.view=d.view||"month";state.cursor=d.cursor||Date.now();state.theme=d.theme||"light";
  state.events=Array.isArray(d.events)?d.events:[];
  state.cats=Array.isArray(d.cats)&&d.cats.length?d.cats:[...DEFAULT_CATS.map(c=>({...c}))];
  state.hiddenCats=new Set(d.hiddenCats||[]);
  state.notified=d.notified||{};
  state.habits=Array.isArray(d.habits)?d.habits:[];
  state.habits.forEach(h=>{if(!h.hc)h.hc=h.color;});
  state.logs=(d.logs&&typeof d.logs==="object")?d.logs:{};
  state.habitYear=d.habitYear||new Date().getFullYear();
  state.kanban=(d.kanban&&Array.isArray(d.kanban.boards))?d.kanban:{categories:[],boards:[],cur:null,curCat:null,undo:{},redo:{}};
  if(!Array.isArray(state.kanban.categories))state.kanban.categories=[];
  if(!state.kanban.curCat)state.kanban.curCat=null;
  state.quicknotes=Array.isArray(d.quicknotes)?d.quicknotes:[];
}
function load(){
  try{
    // 读取本机 localStorage（本地缓存副本；权威数据在云端，由 loadCloud 拉取）
    const raw=localStorage.getItem(LS_KEY) || localStorage.getItem("warmcal.v1"); // 兼容旧版 key，避免改名后丢数据
    if(raw){ try{ applyData(JSON.parse(raw)); }catch(_){} }
  }catch(e){}
  kbInit();qnInit();
  document.documentElement.setAttribute("data-theme",state.theme);
}
function getEvent(id){return state.events.find(e=>e.id===id);}
function catColor(id){const c=state.cats.find(c=>c.id===id);return c?c.color:"#8C857B";}
function visibleEvents(){
  const q=state.search.trim().toLowerCase();
  return state.events.filter(e=>{
    if(state.hiddenCats.has(e.cat))return false;
    if(q && !(e.title||"").toLowerCase().includes(q))return false;
    return true;
  });
}
function evRepeat(e){return e.repeat&&e.repeat.type&&e.repeat.type!=="none"?e.repeat:{type:"none"};}
/* 判断事件 e 在日期 t（dateOnly 时间戳）是否发生 */
function occursOn(e,t){
  const sd=dateOnly(e.start);
  if(t<sd)return false;
  const rep=evRepeat(e);
  if(rep.end&&t>dateOnly(rep.end))return false;
  const dw=new Date(t).getDay();
  switch(rep.type){
    case "daily":return true;
    case "workday":return dw>=1&&dw<=5;
    case "weekend":return dw===0||dw===6;
    case "weekly":return dw===new Date(sd).getDay();
    case "monthly":return new Date(t).getDate()===new Date(sd).getDate();
    case "yearly":{const a=new Date(t),b=new Date(sd);return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
    case "custom":return Array.isArray(rep.days)&&rep.days.includes(dw);
    default:return t===sd;
  }
}
/* 把事件 e 的发生时间平移到日期 t（保留时分与时长） */
function occurrenceTimes(e,t){
  if(e.allDay)return {start:dateOnly(t),end:dateOnly(t)+DAY};
  const base=new Date(e.start);
  const dur=Math.max(e.end-e.start,0);
  const s=new Date(t);s.setHours(base.getHours(),base.getMinutes(),0,0);
  const start=s.getTime();
  return {start,end:start+dur};
}
/* 展开某天发生的全部事件（含重复实例），返回浅拷贝实例 */
function eventsOnDay(t){
  const out=[];
  visibleEvents().forEach(e=>{
    if(occursOn(e,t)){const o=occurrenceTimes(e,t);out.push(Object.assign({},e,{start:o.start,end:o.end}));}
  });
  return out.sort((a,b)=>a.start-b.start);
}

/* ============ 主渲染 ============ */
const view=$("#view");
function render(){
  document.documentElement.setAttribute("data-theme",state.theme);
  const cal=state.module==="calendar";
  const heat=state.module==="heatmap";
  const kbM=state.module==="kanban";
  const qn=state.module==="notes";
  $$("#viewSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.v===state.view));
  $$("#modSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.mod===state.module));
  $("#viewSwitch").style.display=cal?"":"none";
  $(".search").style.display=cal?"":"none";
  $(".nav").style.display=(kbM||qn)?"none":"";
  $("#todayBtn").textContent=cal?"今天":"今年";
  $("#view").classList.toggle("kb-mode",kbM);
  renderNavTitle();
  try{
    if(cal){
      if(state.view==="month")renderMonth();
      else if(state.view==="week")renderWeek();
      else if(state.view==="day")renderDay();
      else if(state.view==="year")renderYear();
      else renderAgenda();
    }else if(heat){
      renderHeatmap();
    }else if(kbM){
      renderKanban();
    }else if(qn){
      renderNotes();
    }
  }catch(err){
    console.error("模块渲染失败:",err);
    view.innerHTML=`<div class="empty-hint" style="color:var(--pop)">渲染出错，请按 F12 查看控制台详情<br><small>${esc(err.message)}</small></div>`;
  }
  renderSidebar();
  save();
}
function setModule(m){state.module=m;render();}
function setView(v){state.view=v;render();}
function nav(dir){
  if(state.module==="kanban")return;
  if(state.module==="heatmap"){state.habitYear+=dir;render();return;}
  if(state.view==="month")state.cursor=addMonths(state.cursor,dir);
  else if(state.view==="week")state.cursor=addDays(state.cursor,dir*7);
  else if(state.view==="day")state.cursor=addDays(state.cursor,dir);
  else if(state.view==="year")state.cursor=addMonths(state.cursor,dir*12);
  else state.cursor=addMonths(state.cursor,dir);
  render();
}
function renderNavTitle(){
  if(state.module==="kanban"){const b=kbCur();$("#navTitle").textContent=b?("看板 · "+b.title):"看板";return;}
  if(state.module==="heatmap"){$("#navTitle").textContent=state.habitYear+"年";return;}
  if(state.module==="notes"){$("#navTitle").textContent="速记";return;}
  const x=new Date(state.cursor);
  if(state.view==="month"||state.view==="agenda"||state.view==="year")
    $("#navTitle").textContent = state.view==="year" ? x.getFullYear()+"年" : x.getFullYear()+"年"+(x.getMonth()+1)+"月";
  else if(state.view==="week"){
    const s=weekStart(state.cursor);const e=addDays(s,6);
    $("#navTitle").textContent=(new Date(s).getMonth()+1)+"/"+new Date(s).getDate()+" – "+(new Date(e).getMonth()+1)+"/"+new Date(e).getDate();
  }else{
    $("#navTitle").textContent=(x.getMonth()+1)+"月"+x.getDate()+"日";
  }
}
function weekStart(ms){const x=new Date(ms);return addDays(dateOnly(ms),-x.getDay());}

/* ============ 月视图 ============ */
function eventChip(e){
  const cls="event"+(e.allDay?" allday":"");
  return `<div class="${cls}" data-id="${e.id}" style="--c:${catColor(e.cat)}"><span class="dot"></span><span class="tt">${esc(e.title||"(无标题)")}</span></div>`;
}
function renderMonth(){
  const [y,m]=ymd(state.cursor);
  const first=new Date(y,m,1);
  const gstart=addDays(dateOnly(first.getTime()),-first.getDay());
  let html='<div class="month-head">'+WK.map(w=>`<div class="wd">${w}</div>`).join("")+'</div><div class="month-grid">';
  const today=dateOnly(Date.now());
  for(let i=0;i<42;i++){
    const dt=new Date(gstart + i*DAY);const t=dateOnly(dt.getTime());
    const [,mm,dd]=ymd(t);
    const inMonth=mm===m;
    const isToday=t===today;
    const dayEvs=eventsOnDay(t);
    let inner="";
    dayEvs.slice(0,3).forEach(e=>inner+=eventChip(e));
    if(dayEvs.length>3)inner+=`<div class="more" data-date="${t}">+${dayEvs.length-3} 更多</div>`;
    html+=`<div class="cell ${inMonth?"":"out"} ${isToday?"today":""}" data-date="${t}"><div class="dnum">${dd}</div><div class="evs">${inner}</div></div>`;
  }
  html+="</div>";
  view.innerHTML=html;
}

/* ============ 周/日 时间网格 ============ */
function hourHTML(){let h="";for(let i=0;i<24;i++)h+=`<div class="hl"></div>`;return h;}
function layoutDay(evs){
  const sorted=[...evs].sort((a,b)=>a.start-b.start);
  const clusters=[];let cur=null;
  sorted.forEach(e=>{if(!cur||e.start>=cur.max){cur={evs:[e],max:e.end};clusters.push(cur);}else{cur.evs.push(e);cur.max=Math.max(cur.max,e.end);}});
  const out=[];
  clusters.forEach(cl=>{
    const ends=[];
    const items=cl.evs.map(e=>{
      let ci=ends.findIndex(en=>e.start>=en);
      if(ci===-1){ci=ends.length;ends.push(e.end);}else ends[ci]=e.end;
      return {ev:e,col:ci};
    });
    const n=ends.length;
    items.forEach(it=>out.push({ev:it.ev,left:it.col/n,width:1/n}));
  });
  return out;
}
function nowLineHTML(){
  const now=Date.now();
  if(state.view!=="week"&&state.view!=="day")return "";
  const top=(minOfDay(now)/60)*52;
  return `<div class="nowline" style="top:${top}px"></div>`;
}
function renderTimeGrid(days){
  const total=52*24;
  const H=52;
  // 全天事件
  let allday="";
  const range=days.map(d=>dateOnly(d.getTime()));
  allday+=`<div class="allday-row"><div class="ad-label">全天</div><div class="ad-cells">`;
  days.forEach(dt=>{
    const t=dateOnly(dt.getTime());
    const here=eventsOnDay(t).filter(e=>e.allDay);
    let c="";
    here.forEach(e=>c+=`<div class="ad-event" data-id="${e.id}" style="--c:${catColor(e.cat)}">${esc(e.title||"(无标题)")}</div>`);
    allday+=`<div class="ad-cell">${c}</div>`;
  });
  allday+=`</div></div>`;
  // 列头
  let colhead='<div class="tg-colhead"><div style="width:54px;flex:none"></div>';
  days.forEach(dt=>{const t=dateOnly(dt.getTime());const x=new Date(t);const isT=sameDay(t,Date.now());
    colhead+=`<div class="dayhead ${isT?"today":""}" data-date="${t}"><div class="dh-d">${x.getDate()}</div><div class="dh-w">周${WK[x.getDay()]}</div></div>`;});
  colhead+="</div>";
  // 主体
  let body='<div class="tg-axis-body">';
  for(let i=0;i<24;i++)body+=`<div class="ah"><span>${i}:00</span></div>`;
  body+="</div>";
  days.forEach(dt=>{
    const t=dateOnly(dt.getTime());
    const dayEvs=eventsOnDay(t).filter(e=>!e.allDay);
    const laid=layoutDay(dayEvs);
    let evs="";
    laid.forEach(L=>{
      const top=(minOfDay(L.ev.start)/60)*H;
      const durMin=(L.ev.end-L.ev.start)/60000;
      const punctual=durMin===0;
      const h=punctual?22:Math.max(durMin/60*H,18);
      const cls="tevent"+(punctual?" punctual":"");
      const bell=(Array.isArray(L.ev.reminders)&&L.ev.reminders.length)?'<svg class="ic ag-bell" viewBox="0 0 24 24"><use href="#ic-bell"/></svg>':'';
      evs+=`<div class="${cls}" data-id="${L.ev.id}" style="--c:${catColor(L.ev.cat)};top:${top}px;height:${h}px;left:${L.left*100}%;width:${L.width*100}%"><span class="tt">${esc(L.ev.title||"(无标题)")}</span><span class="tm">${fmtTime(L.ev.start)}${bell}</span>${punctual?"":'<div class="rgrip"></div>'}</div>`;
    });
    body+=`<div class="daycol" data-date="${t}" style="height:${total}px"><div class="hourlines">${hourHTML()}</div><div class="evlayer">${evs}${nowLineHTML()}</div></div>`;
  });
  const grid=`<div class="timegrid">${colhead}${allday}<div class="tg-body">${body}</div></div>`;
  view.innerHTML=grid;
  // 自动滚动到首个事件 / 当前时间（拖拽中不打断）
  if(!dragging){
    let firstEv=null;
    for(const t of range){const d=eventsOnDay(t).filter(e=>!e.allDay);if(d.length){firstEv=d[0];break;}}
    const scrollTo=firstEv?minOfDay(firstEv.start)/60*H-80:(state.view==="day"&&sameDay(state.cursor,Date.now())?minOfDay(Date.now())/60*H-120:0);
    requestAnimationFrame(()=>{view.scrollTop=Math.max(0,scrollTo);});
  }
}
function renderWeek(){renderTimeGrid(Array.from({length:7},(_,i)=>new Date(addDays(weekStart(state.cursor),i))));}
function renderDay(){renderTimeGrid([new Date(dateOnly(state.cursor))]);}

/* ============ 年视图 ============ */
function ymCell(y,m,dt){
  const t=dateOnly(dt.getTime());
  const [,mm,dd]=ymd(t);
  const out=mm!==m;
  const isT=sameDay(t,Date.now());
  const isSel=t===dateOnly(state.cursor);
  const has=eventsOnDay(t).length>0;
  return `<div class="ym-cell ${out?"out":""} ${isT?"today":""} ${isSel?"selected":""} ${has?"has":""}" data-date="${t}">${dd}</div>`;
}
function renderYear(){
  const y=new Date(state.cursor).getFullYear();
  let html='<div class="year-grid">';
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1);
    const gstart=addDays(dateOnly(first.getTime()),-first.getDay());
    html+=`<div class="ym"><div class="ym-t">${y}年${m+1}月</div><div class="ym-grid">`;
    html+=WK.map(w=>`<div class="ym-wd">${w}</div>`).join("");
    for(let i=0;i<42;i++)html+=ymCell(y,m,new Date(gstart + i*DAY));
    html+="</div></div>";
  }
  html+="</div>";
  view.innerHTML=html;
}

/* ============ 议程视图 ============ */
function agendaEvents(){
  // 议程只显示用户主动添加的单次事件（非重复），避免被定时任务/重复事件的未来实例淹没
  const out=[];
  visibleEvents().forEach(e=>{
    if(evRepeat(e).type==="none"){out.push(e);}
  });
  return out;
}
function renderAgenda(){
  const evs=agendaEvents().slice().sort((a,b)=>b.start-a.start);
  if(!evs.length){view.innerHTML=`<div class="empty-hint">还没有安排<br>点左上角「＋ 新建事件」开始吧</div>`;return;}
  const groups={};
  evs.forEach(e=>{const k=dateOnly(e.start);(groups[k]=groups[k]||[]).push(e);});
  const keys=Object.keys(groups).map(Number).sort((a,b)=>b-a);
  let html='<div class="agenda">';
  keys.forEach(k=>{
    const x=new Date(k);

/* ============ 热力图（习惯记录台） ============ */
const LEVEL_TXT=["无记录","轻度","中度","良好","满分"];
function renderHeatmap(){
  if(!state.habits.length){
    view.innerHTML=`<div class="empty-hint">还没有习惯<br>点左侧「＋ 新建习惯」开始记录吧</div>`;
    return;
  }
  let html="";
  state.habits.forEach(h=>{html+=habitCardHTML(h,state.habitYear);});
  view.innerHTML=`<div class="hm-wrap">${html}</div>`;
}
function habitCardHTML(h,year){
  const y0=new Date(year,0,1);
  const start=addDays(dateOnly(y0.getTime()),-y0.getDay());
  const todayTs=dateOnly(Date.now());
  const weeks=53;
  let cells="";
  const monthLabels=[];
  let lastMonth=-1;
  for(let w=0;w<weeks;w++){
    let colMonth=-1;
    for(let d=0;d<7;d++){
      const dt=addDays(start,w*7+d);
      const dy=new Date(dt);
      if(dy.getFullYear()===year && colMonth===-1)colMonth=dy.getMonth();
      if(dy.getFullYear()!==year){cells+=`<div class="hm-cell empty"></div>`;continue;}
      const key=toInputDate(dt);
      const lvl=(state.logs[h.id]&&state.logs[h.id][key])||0;
      const isToday=dt===todayTs;
      const dlabel=`${dy.getFullYear()}-${String(dy.getMonth()+1).padStart(2,"0")}-${String(dy.getDate()).padStart(2,"0")}（周${WK[dy.getDay()]}）`;
      cells+=`<div class="hm-cell ${lvl?"l"+lvl:""} ${isToday?"today":""}" data-habit="${h.id}" data-date="${dt}" title="${isToday?"今天 · "+dlabel:dlabel}"></div>`;
    }
    if(colMonth!==-1 && colMonth!==lastMonth){monthLabels.push(MON[colMonth]);lastMonth=colMonth;}
    else monthLabels.push("");
  }
  const s=habitStats(h,year);
  const months=monthLabels.map(t=>`<div class="hm-ml">${t}</div>`).join("");
  const legend=`<span class="lc"></span><span class="lc l1"></span><span class="lc l2"></span><span class="lc l3"></span><span class="lc l4"></span>`;
  return `<div class="hm-card" draggable="true" data-habit="${h.id}" style="--hc:${h.hc||h.color}">
    <div class="hm-head">
      <span class="hm-drag" title="拖动调整顺序"><svg class="ic"><use href="#ic-grip"/></svg></span>
      <div class="hm-name">${esc(h.name)}</div>
      <div class="hm-stats">
        <span>完成 <b>${s.total}</b> 天</span>
        <span>当前连续 <b>${s.cur}</b></span>
        <span>最长连续 <b>${s.max}</b></span>
      </div>
      <button class="hm-del" data-del="${h.id}" title="删除习惯"><svg class="ic"><use href="#ic-x"/></svg></button>
    </div>
    <div class="hm-body">
      <div class="hm-dow"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>
      <div class="hm-main">
        <div class="hm-months">${months}</div>
        <div class="hm-grid">${cells}</div>
      </div>
    </div>
    <div class="hm-legend"><span>Less</span>${legend}<span>More</span></div>
  </div>`;
}
function habitStats(h,year){
  const log=state.logs[h.id]||{};
  const ystr=String(year);
  const dates=Object.keys(log).filter(k=>(log[k]>=1)&&k.slice(0,4)===ystr).sort();
  const total=dates.length;
  // 当前连续：从今天往前数
  let cur=0;let d=dateOnly(Date.now());
  while((log[toInputDate(d)]||0)>=1){cur++;d=addDays(d,-1);}
  // 最长连续
  let max=0,run=0;
  for(let i=0;i<dates.length;i++){
    if(i===0){run=1;max=Math.max(max,1);continue;}
    if(fromDateKey(dates[i])-fromDateKey(dates[i-1])===DAY){run++;max=Math.max(max,run);}
    else run=1;
  }
  return {total,cur,max};
}
function cycleHabit(hid,ms){
  const log=state.logs[hid]||(state.logs[hid]={});
  const key=toInputDate(ms);
  const nx=((log[key]||0)+1)%5;
  if(nx===0)delete log[key];else log[key]=nx;
  render();
}
function openHabitModal(existing){
  editingHabitId=existing?existing.id:null;
  $("#habitModalTitle").textContent=existing?"编辑习惯":"新建习惯";
  $("#fHabitName").value=existing?existing.name:"";
  const defColor=CAT_PALETTE[state.habits.length%CAT_PALETTE.length];
  const color=existing?(existing.color||defColor):defColor;
  const hc=existing?(existing.hc||shadeColor(color,-25)):shadeColor(color,-25);
  $("#fHabitColor").value=color;
  $("#fHabitColor").dataset.hc=hc;
  $("#habitDeleteBtn").style.display=existing?"":"none";
  updateHeatRamp();
  $("#habitOverlay").classList.add("show");
  $("#fHabitName").focus();
}
function updateHeatRamp(){
  const c=$("#fHabitColor").value;
  const h=$("#fHabitColor").dataset.hc || shadeColor(c,-25);
  $("#heatRamp").style.setProperty("--hc",h);
}
function saveHabit(){
  const name=$("#fHabitName").value.trim();
  if(!name){alert("请填写习惯名称");return;}
  const color=$("#fHabitColor").value;
  const hc=$("#fHabitColor").dataset.hc || shadeColor(color,-25);
  if(editingHabitId){
    const h=state.habits.find(x=>x.id===editingHabitId);
    if(h){h.name=name;h.color=color;h.hc=hc;}
  }else{
    const id=uid();
    state.habits.push({id,name,color,hc});
    state.logs[id]={};
  }
  closeHabitModal();
  render();
}
function closeHabitModal(){$("#habitOverlay").classList.remove("show");}
function deleteHabit(id){
  if(state.habits.length<=1){alert("至少保留一个习惯，无法删除。");return;}
  const h=state.habits.find(x=>x.id===id);if(!h)return;
  if(!confirm(`确定删除习惯「${h.name}」？该习惯的所有记录将一并删除。`))return;
  state.habits=state.habits.filter(x=>x.id!==id);
  delete state.logs[id];
  closeHabitModal();
  render();
}

/* ============ 看板模块（操作逻辑参考 nullboard） ============ */
function kbInit(){
  if(!state.kanban||!Array.isArray(state.kanban.boards))state.kanban={categories:[],boards:[],cur:null,undo:{},redo:{}};
  if(!state.kanban.undo)state.kanban.undo={};
  if(!state.kanban.redo)state.kanban.redo={};
  if(!Array.isArray(state.kanban.categories))state.kanban.categories=[];
  state.kanban.boards.forEach(b=>{
    if(!b.id)b.id=uid();
    if(!b.title)b.title="未命名看板";
    if(!b.categoryId)b.categoryId=null;
    if(!Array.isArray(b.lists))b.lists=[];
    b.lists.forEach(l=>{
      if(!l.id)l.id=uid();
      if(!l.title)l.title="列表";
      if(!Array.isArray(l.notes))l.notes=[];
      l.notes.forEach(n=>{
        if(!n.id)n.id=uid();
        if(typeof n.text!=="string")n.text="";
        if(typeof n.raw!=="boolean")n.raw=false;
        if(typeof n.min!=="boolean")n.min=false;
      });
    });
  });
  // 旧数据没有分类时，补一个默认分类并把现有看板归进去
  if(!state.kanban.categories.length){
    const cid=uid();
    state.kanban.categories.push({id:cid,name:"默认分类"});
    state.kanban.boards.forEach(b=>{if(!b.categoryId)b.categoryId=cid;});
  }
  // 清理孤儿看板（categoryId 不存在）
  const cids=new Set(state.kanban.categories.map(c=>c.id));
  state.kanban.boards.forEach(b=>{if(!cids.has(b.categoryId))b.categoryId=state.kanban.categories[0].id;});
  if(!state.kanban.boards.length){
    const cid=state.kanban.categories[0]?state.kanban.categories[0].id:uid();
    if(!state.kanban.categories.length)state.kanban.categories.push({id:cid,name:"默认分类"});
    state.kanban.boards.push({id:uid(),categoryId:cid,title:"我的看板",lists:[
      {id:uid(),title:"待办",notes:[{id:uid(),text:"点击卡片即可编辑内容",raw:false,min:false},{id:uid(),text:"拖动卡片可调整顺序，或移动到其他列表",raw:false,min:false}]},
      {id:uid(),title:"进行中",notes:[{id:uid(),text:"把鼠标移到卡片上，用 × 删除、○ 切换强调、▣ 折叠",raw:false,min:false}]},
      {id:uid(),title:"已完成",notes:[]}
    ]});
  }
  if(!state.kanban.cur||!state.kanban.boards.find(b=>b.id===state.kanban.cur)){
    state.kanban.cur=state.kanban.boards[0]?state.kanban.boards[0].id:null;
  }
  // 当前选中分类归一化：无效时回退到当前看板的分类，再退到第一个分类
  if(!state.kanban.curCat||!state.kanban.categories.find(c=>c.id===state.kanban.curCat)){
    const curBoard=state.kanban.boards.find(b=>b.id===state.kanban.cur)||state.kanban.boards[0];
    state.kanban.curCat=(curBoard&&curBoard.categoryId)||(state.kanban.categories[0]&&state.kanban.categories[0].id)||null;
  }
}
function kbCur(){return state.kanban.boards.find(b=>b.id===state.kanban.cur)||state.kanban.boards[0];}
function kbFirstLine(t){return (t||"").split("\n")[0];}
function kbHistoryPush(){
  const b=kbCur();if(!b)return;
  if(!state.kanban.undo[b.id])state.kanban.undo[b.id]=[];
  state.kanban.redo[b.id]=[];
  state.kanban.undo[b.id].push(JSON.parse(JSON.stringify(b)));
  if(state.kanban.undo[b.id].length>50)state.kanban.undo[b.id].shift();
}
function kbUndo(){
  const b=kbCur();if(!b)return;
  const u=state.kanban.undo[b.id]||[];
  if(!u.length){showToast("没有可撤销的操作");return;}
  if(!state.kanban.redo[b.id])state.kanban.redo[b.id]=[];
  state.kanban.redo[b.id].push(JSON.parse(JSON.stringify(b)));
  const snap=u.pop();
  state.kanban.boards=state.kanban.boards.map(x=>x.id===b.id?snap:x);
  save();renderKanban();
}
function kbRedo(){
  const b=kbCur();if(!b)return;
  const r=state.kanban.redo[b.id]||[];
  if(!r.length){showToast("没有可重做的操作");return;}
  if(!state.kanban.undo[b.id])state.kanban.undo[b.id]=[];
  state.kanban.undo[b.id].push(JSON.parse(JSON.stringify(b)));
  const snap=r.pop();
  state.kanban.boards=state.kanban.boards.map(x=>x.id===b.id?snap:x);
  save();renderKanban();
}

function kbDeleteCategory(cid){
  if(state.kanban.categories.length<=1){alert("至少保留一个分类，无法删除。");return;}
  const c=state.kanban.categories.find(x=>x.id===cid);if(!c)return;
  const boards=state.kanban.boards.filter(b=>b.categoryId===cid);
  const msg=boards.length?`分类「${c.name}」下有 ${boards.length} 个看板，删除后这些看板将一并删除。确定删除？`:`确定删除分类「${c.name}」？`;
  if(!confirm(msg))return;
  state.kanban.categories=state.kanban.categories.filter(x=>x.id!==cid);
  state.kanban.boards=state.kanban.boards.filter(b=>b.categoryId!==cid);
  delete state.kanban.undo[cid];
  delete state.kanban.redo[cid];
  if(!state.kanban.boards.find(b=>b.id===state.kanban.cur)){
    state.kanban.cur=state.kanban.boards[0]?state.kanban.boards[0].id:null;
  }
  if(state.kanban.curCat===cid){
    const nb=state.kanban.boards.find(b=>b.id===state.kanban.cur);
    state.kanban.curCat=(nb&&nb.categoryId)||(state.kanban.categories[0]&&state.kanban.categories[0].id)||null;
  }
  save();render();
}
function kbRenameBoard(){
  const b=kbCur();if(!b)return;
  const chip=view.querySelector('.kb-chip[data-board="'+b.id+'"]');
  if(!chip)return;
  const inp=document.createElement("input");
  inp.className="kb-chip-edit";inp.value=b.title;
  chip.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{const v=inp.value.trim();if(v&&v!==b.title){kbHistoryPush();b.title=v;}save();renderKanban();};
  inp.addEventListener("blur",commit);
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();inp.blur();}
    else if(e.key==="Escape"){e.preventDefault();renderKanban();}
  });
}
function kbDeleteBoard(){
  if(state.kanban.boards.length<=1){alert("至少保留一个看板，无法删除。");return;}
  const b=kbCur();
  if(!confirm(`确定永久删除看板「${b.title}」？其全部列表与卡片将一并删除，此操作不可恢复。`))return;
  state.kanban.boards=state.kanban.boards.filter(x=>x.id!==b.id);
  delete state.kanban.undo[b.id];delete state.kanban.redo[b.id];
  state.kanban.cur=state.kanban.boards[0].id;
  state.kanban.curCat=state.kanban.boards[0].categoryId;
  save();renderKanban();
}
function kbExportBoard(){
  const b=kbCur();if(!b)return;
  const data={format:"mytime-kanban",version:1,exportedAt:Date.now(),board:b};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="看板-"+b.title+"-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
}
function kbImportBoard(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);
      const board=d.board||(d.boards&&d.boards[0])||(d.lists?d:null);
      if(!board||!Array.isArray(board.lists)){alert("这不是有效的看板导出文件");return;}
      board.id=uid();
      if(!board.title)board.title="导入的看板";
      board.lists=board.lists.map(l=>({id:uid(),title:l.title||"列表",notes:(l.notes||[]).map(n=>({id:uid(),text:n.text||"",raw:!!n.raw,min:!!n.min}))}));
      const cur=kbCur();
      const curCat=state.kanban.curCat&&state.kanban.categories.find(c=>c.id===state.kanban.curCat);
      board.categoryId=curCat?curCat.id:(cur?cur.categoryId:(state.kanban.categories[0]&&state.kanban.categories[0].id));
      state.kanban.boards.push(board);state.kanban.cur=board.id;state.kanban.curCat=board.categoryId;
      save();renderKanban();showToast("已导入看板「"+board.title+"」");
    }catch(err){alert("导入失败：文件格式不正确");}};
    r.readAsText(f);
  };
  inp.click();
}
function kbAddList(){
  const b=kbCur();if(!b)return;
  kbHistoryPush();
  b.lists.push({id:uid(),title:"新列表",notes:[]});
  save();renderKanban();
}
function kbDeleteList(li){
  const b=kbCur();if(!b)return;
  const L=b.lists[li];if(!L)return;
  if(!confirm(`确定删除列表「${L.title}」？该列表下的 ${L.notes.length} 张卡片将一并删除。`))return;
  kbHistoryPush();
  b.lists.splice(li,1);
  save();renderKanban();
}
function kbAddCard(li){
  const b=kbCur();if(!b)return;
  const L=b.lists[li];if(!L)return;
  kbHistoryPush();
  L.notes.push({id:uid(),text:"",raw:false,min:false});
  save();renderKanban();
  kbEditCard(li,L.notes.length-1);
}
function kbEditCard(li,ni){
  const card=view.querySelector('.kb-card[data-li="'+li+'"][data-ni="'+ni+'"]');
  if(!card)return;
  const L=kbCur().lists[li];if(!L)return;
  const note=L.notes[ni];if(!note)return;
  card.classList.add("editing");
  const ta=document.createElement("textarea");
  ta.className="kb-edit";ta.value=note.text;
  const txt=card.querySelector(".kb-card-text");
  if(txt)txt.replaceWith(ta);
  ta.focus();
  try{ta.select();}catch(e){}
  let done=false;
  const commit=cancel=>{
    if(done)return;done=true;
    const val=ta.value;
    if(!cancel&&val!==note.text){kbHistoryPush();note.text=val;save();}
    renderKanban();
  };
  ta.addEventListener("blur",()=>commit(false));
  ta.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.preventDefault();commit(true);}
    else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();commit(false);}
    else if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();commit(false);}
  });
}
function kbDeleteCard(li,ni){
  const b=kbCur();if(!b)return;
  if(!b.lists[li]||!b.lists[li].notes[ni])return;
  kbHistoryPush();
  b.lists[li].notes.splice(ni,1);
  save();renderKanban();
}
function kbToggle(li,ni,key){
  const b=kbCur();if(!b)return;
  const n=b.lists[li]&&b.lists[li].notes[ni];if(!n)return;
  kbHistoryPush();
  n[key]=!n[key];
  save();renderKanban();
}
function kbMoveCard(sl,sn,dl,dn){
  const b=kbCur();if(!b)return;
  if(!b.lists[sl]||!b.lists[dl])return;
  if(sl===dl&&sn===dn)return;
  kbHistoryPush();
  const note=b.lists[sl].notes[sn];
  b.lists[sl].notes.splice(sn,1);
  let idx=dn;
  if(sl===dl&&sn<dn)idx=dn-1;
  if(idx<0)idx=0;
  if(idx>b.lists[dl].notes.length)idx=b.lists[dl].notes.length;
  b.lists[dl].notes.splice(idx,0,note);
  save();renderKanban();
}
function kbMoveList(sl,dl){
  const b=kbCur();if(!b)return;
  if(sl===dl)return;
  kbHistoryPush();
  const m=b.lists.splice(sl,1)[0];
  if(dl>sl)dl-=1;
  if(dl<0)dl=0;
  if(dl>b.lists.length)dl=b.lists.length;
  b.lists.splice(dl,0,m);
  save();renderKanban();
}
function kanbanClick(e){
  if(e.target.closest(".kb-edit"))return;
  const op=e.target.closest(".kb-op");
  if(op){const li=+op.dataset.li,ni=+op.dataset.ni,act=op.dataset.op;
    if(act==="del")kbDeleteCard(li,ni);
    else if(act==="raw")kbToggle(li,ni,"raw");
    else if(act==="min")kbToggle(li,ni,"min");
    return;}
  const ac=e.target.closest(".kb-add-card");
  if(ac){kbAddCard(+ac.dataset.li);return;}
  const al=e.target.closest('[data-act="add-list"]');
  if(al){kbAddList();return;}
  const ld=e.target.closest(".kb-list-del");
  if(ld){kbDeleteList(+ld.dataset.li);return;}
  const chip=e.target.closest(".kb-chip[data-board]");
  if(chip){
    state.kanban.cur=chip.dataset.board;
    const bb=state.kanban.boards.find(x=>x.id===chip.dataset.board);
    if(bb)state.kanban.curCat=bb.categoryId;
    save();renderKanban();return;
  }
  const actBtn=e.target.closest("[data-act]");
  if(actBtn){const a=actBtn.dataset.act;
    if(a==="add-board")kbAddBoard();
    else if(a==="undo")kbUndo();
    else if(a==="redo")kbRedo();
    else if(a==="rename-board")kbRenameBoard();
    else if(a==="del-board")kbDeleteBoard();
    else if(a==="exp-board")kbExportBoard();
    else if(a==="imp-board")kbImportBoard();
    return;}
  const card=e.target.closest(".kb-card");
  if(card){if(card.classList.contains("editing"))return;kbEditCard(+card.dataset.li,+card.dataset.ni);return;}
}
let dragKind=null,dragData=null;
function kbInsertIndex(container,y){
  const cards=[...container.querySelectorAll(".kb-card:not(.dragging)")];
  for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(y<r.top+r.height/2)return i;}
  return cards.length;
}
view.addEventListener("dragstart",e=>{
  if(state.module!=="kanban")return;
  const card=e.target.closest(".kb-card");
  const list=e.target.closest(".kb-list");
  if(card&&!e.target.closest(".kb-op")){
    dragKind="card";dragData={li:+card.dataset.li,ni:+card.dataset.ni};
    card.classList.add("dragging");e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain","c");}catch(_){}
  }else if(list){
    dragKind="list";dragData={li:+list.dataset.li};
    list.classList.add("ldragging");e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain","l");}catch(_){}
  }else return;
});
view.addEventListener("dragend",()=>{
  $$(".kb-card.dragging").forEach(c=>c.classList.remove("dragging"));
  $$(".kb-list.ldragging").forEach(c=>c.classList.remove("ldragging"));
  dragKind=null;dragData=null;
});
view.addEventListener("dragover",e=>{
  if(state.module!=="kanban"||!dragKind)return;
  e.preventDefault();e.dataTransfer.dropEffect="move";
});
view.addEventListener("drop",e=>{
  if(state.module!=="kanban"||!dragKind)return;
  e.preventDefault();
  if(dragKind==="card"){
    const cards=e.target.closest(".kb-cards");if(!cards)return;
    const dl=+cards.dataset.li;
    const dn=kbInsertIndex(cards,e.clientY);
    kbMoveCard(dragData.li,dragData.ni,dl,dn);
  }else if(dragKind==="list"){
    const board=e.target.closest(".kb-board");if(!board)return;
    const overList=e.target.closest(".kb-list");
    const dl=overList?+overList.dataset.li:kbCur().lists.length;
    kbMoveList(dragData.li,dl);
  }
});
view.addEventListener("change",e=>{
  if(state.module!=="kanban")return;
  const t=e.target.closest(".kb-list-title");
  if(t){const li=+t.dataset.li;const b=kbCur();const L=b.lists[li];if(!L)return;
    const v=t.value.trim()||"未命名列表";if(v!==L.title){kbHistoryPush();L.title=v;save();}}
});
view.addEventListener("keydown",e=>{
  if(state.module!=="kanban")return;
  const t=e.target.closest(".kb-list-title");
  if(t&&e.key==="Enter"){e.preventDefault();t.blur();}
});

/* ============ 重复规则 ============ */
const REPEAT_WD=[1,2,3,4,5,6,0]; // 周一..周日，对应 getDay()
function repeatOptions(startMs){
  const x=new Date(startMs);
  const wd=WK[x.getDay()];
  const d=x.getDate();
  const m=x.getMonth()+1;
  return [
    {v:"none",label:"不重复"},
    {v:"daily",label:"每天"},
    {v:"workday",label:"每周一至周五"},
    {v:"weekend",label:"每周六、周日"},
    {v:"weekly",label:"每周（周"+wd+"）"},
    {v:"monthly",label:"每月（"+d+"日）"},
    {v:"yearly",label:"每年（"+m+"月"+d+"日）"},
    {v:"custom",label:"自定义（选择周几）"},
  ];
}
function renderRepeatPick(startMs,rep){
  rep=rep||{type:"none"};
  const opts=repeatOptions(startMs);
  $("#fRepeat").innerHTML=opts.map(o=>`<option value="${o.v}">${esc(o.label)}</option>`).join("");
  $("#fRepeat").value=rep.type||"none";
  const days=REPEAT_WD.map(dw=>{
    const sel=Array.isArray(rep.days)&&rep.days.includes(dw)?"checked":"";
    return `<label class="${sel?"sel":""}"><input type="checkbox" value="${dw}" ${sel}>${WK[dw]}</label>`;
  }).join("");
  $("#fRepeatCustom").innerHTML=days;
  $("#fRepeatCustom").onchange=e=>{const cb=e.target;if(cb.tagName==="INPUT")cb.parentElement.classList.toggle("sel",cb.checked);updateRepeatHint(startMs,currentRepeatData());};
  const custom=($("#fRepeat").value==="custom");
  $("#fRepeatCustomRow").style.display=custom?"":"none";
  updateRepeatHint(startMs,rep);
}
function currentRepeatData(){
  const type=$("#fRepeat").value;
  const days=[...$$("#fRepeatCustom input:checked")].map(cb=>+cb.value);
  return {type,days};
}
function updateRepeatHint(startMs,rep){
  rep=rep||currentRepeatData();
  const x=new Date(startMs);
  const sd=x.getFullYear()+"年"+(x.getMonth()+1)+"月"+x.getDate()+"日";
  let txt="";
  const type=rep.type||"none";
  if(type==="none")txt="仅此一次，不重复";
  else if(type==="daily")txt="从 "+sd+" 起每天重复";
  else if(type==="workday")txt="从 "+sd+" 起每周一至周五重复";
  else if(type==="weekend")txt="从 "+sd+" 起每周六、周日重复";
  else if(type==="weekly")txt="从 "+sd+" 起每周（周"+WK[x.getDay()]+"）重复";
  else if(type==="monthly")txt="从 "+sd+" 起每月 "+x.getDate()+" 日重复";
  else if(type==="yearly")txt="从 "+sd+" 起每年 "+(x.getMonth()+1)+"月"+x.getDate()+"日重复";
  else if(type==="custom"){
    const ds=(rep.days&&rep.days.length?rep.days:[]).slice().sort((a,b)=>a===0?7:a-b).map(dw=>WK[dw]);
    txt=ds.length?("从 "+sd+" 起每 "+ds.join("、")+" 重复"):"请至少选择一个星期";
  }
  $("#repeatHint").textContent=txt;
}
function closeModal(){$("#modalOverlay").classList.remove("show");editingId=null;}
function saveEvent(){
  const title=$("#fTitle").value.trim();
  const allDay=$("#fAllDay").checked;
  let start=fromInputs($("#fStartDate").value,$("#fStartTime").value||"00:00");
  let end=fromInputs($("#fEndDate").value,$("#fEndTime").value||"00:00");
  if(allDay){start=dateOnly(start);end=dateOnly(start)+DAY;}
  if(end<start)end=start; // 允许结束=开始（零时长「定时提醒」），不再自动加 1 小时
  const reminders=$$("#remindPick input:checked").map(cb=>+cb.dataset.mins).sort((a,b)=>b-a);
  const rType=$("#fRepeat").value;
  let repeat={type:rType};
  if(rType==="custom"){
    const days=[...$$("#fRepeatCustom input:checked")].map(cb=>+cb.value);
    repeat={type:"custom",days};
  }
  const data={title:title||"(无标题)",cat:modalCat,allDay,start,end,loc:$("#fLoc").value.trim(),desc:$("#fDesc").value.trim(),reminders,repeat};
  if(editingId){
    const e=getEvent(editingId);Object.assign(e,data);
    // 编辑事件后重置该事件的已提醒记录，避免旧代码留下的错误触发记录挡住新提醒
    Object.keys(state.notified).forEach(k=>{if(k.startsWith(editingId+"_"))delete state.notified[k];});
  }else{state.events.push({id:uid(),...data});}
  closeModal();render();scheduleNextReminder();
}
function deleteEvent(){

  const idx=state.events.findIndex(e=>e.id===editingId);
  if(idx<0){closeModal();return;}
  const removed=state.events[idx];

  closeModal();render();scheduleNextReminder();
  showToast("已删除「"+esc(removed.title)+"」",()=>{state.events.push(removed);render();scheduleNextReminder();});

/* ============ 提醒（页面内卡片 + 标签标题闪烁） ============ */
function formatMins(m){
  if(m===0)return"现在";
  if(m<60)return m+"分钟";
  if(m<1440)return Math.round(m/60)+"小时";
  return Math.round(m/1440)+"天";
}
/* ============ 标签标题闪烁提醒（无需权限，file:// 也有效） ============ */
const _flash={active:new Set(),timer:null,base:document.title};
const _ALERT_ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23e84a5f"/><text x="16" y="22" font-size="18" text-anchor="middle" fill="white">!</text></svg>');
/* 提醒提示音：用 Web Audio API 生成，不依赖外部音频文件，file:// 下也能播放 */
function playReminderSound(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.25);
    gain.gain.setValueAtTime(0.25,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.25);
  }catch(_){}
}
function _flashTick(){
  if(_flash.active.size===0){document.title=_flash.base;return;}
  if(document.title.indexOf("【提醒】")===0){
    document.title=_flash.base;
  }else{
    const items=[..._flash.active];
    const n=items.length;
    const first=items[0].length>10?items[0].slice(0,10)+"…":items[0];
    document.title="【提醒"+(n>1?" ×"+n:"")+"】"+first;
  }
}
function flashTabStart(label){
  _flash.active.add(label);
  if(!_flash.timer){
    _flash.timer=setInterval(_flashTick,600);
    _flashTick();
  }
  // 闪烁时换上红色警示图标，更显眼
  let link=document.querySelector('link[rel~="icon"]');
  if(!link){link=document.createElement("link");link.rel="icon";document.head.appendChild(link);}
  if(link.dataset._orig===undefined)link.dataset._orig=link.href||"";
  link.href=_ALERT_ICON;
}
function flashTabStop(label){
  _flash.active.delete(label);
  if(_flash.active.size===0 && _flash.timer){
    clearInterval(_flash.timer);_flash.timer=null;
    document.title=_flash.base;
  }
  // 没有其它活动提醒时恢复图标
  if(_flash.active.size===0){
    const link=document.querySelector('link[rel~="icon"]');
    if(link && link.dataset._orig!==undefined){link.href=link.dataset._orig;delete link.dataset._orig;}
  }
}
function flashTabStopAll(){
  _flash.active.clear();
  if(_flash.timer){clearInterval(_flash.timer);_flash.timer=null;}

function fireNativeNotification(title,body){
  // Windows 右下角原生 Toast：需 localhost/https 安全上下文 + 用户授权；file:// 下 Notification 不可用，会自动跳过
  try{
    if(typeof Notification==="undefined")return;
    if(Notification.permission!=="granted")return;
    const n=new Notification(title,{body:body, icon:_ALERT_ICON, tag:"mytime-remind", requireInteraction:false});
    n.onclick=()=>{ try{ window.focus(); }catch(_){} n.close(); };
    setTimeout(()=>{ try{ n.close(); }catch(_){} }, 13000);
  }catch(_){}
}
/* 桌面通知授权：用户点击触发的授权流程（比启动时静默请求可靠，浏览器常拦截无手势请求）。
   兼容旧式回调式与 Promise 式 API，带超时兜底。注意：通知权限按网址绑定，需 https/localhost。 */
function initNotifyBanner(){
  try{
    if(typeof Notification==="undefined")return; // file:// / 非安全上下文无 Notification，不显示
    const b=$("#notifyBanner"); if(!b)return;
    const msg=$("#notifyBannerMsg"), btn=$("#notifyBannerBtn");
    if(Notification.permission==="granted"){ b.classList.remove("show"); return; }
    if(Notification.permission==="denied"){
      msg.textContent="桌面通知已被浏览器禁止，请点地址栏左侧图标 → 通知 → 改为「允许」，或在浏览器设置里把本网址加入「允许发送通知」列表";
      btn.style.display="none";
    }else{
      msg.textContent="开启后，任务提醒会在电脑右下角弹窗（即使网页在后台也能收到）";
      btn.style.display="";
    }
    b.classList.add("show");
    // 点击绑定放在这里：每次横幅显示都重新绑一次，杜绝渲染/重绑过程中漏绑
    btn.onclick=()=>{
      try{
        if(typeof Notification==="undefined")return;
        let done=false;
        const after=(p)=>{
          if(done)return; done=true;
          if(p==="granted"){
            try{showToast("已开启桌面通知（Windows 右下角弹窗）");}catch(_){}
            b.classList.remove("show");
            // 立刻触发一次系统弹窗，验证通道真的通了
            try{ new Notification("桌面通知已开启",{body:"任务到点时会在电脑右下角弹窗"}); }catch(_){}
          }else{
            initNotifyBanner();
          }
        };
        // 8 秒兜底：requestPermission 完全无响应（部分浏览器/扩展会静默吞掉）时主动提示
        const tm=setTimeout(()=>{
          if(done)return; done=true;
          try{showToast("通知请求无响应，请在浏览器设置 → 通知 → 把本网址加入「允许」列表");}catch(_){}
        },8000);
        // 旧式回调 + 现代 Promise 双路，任一响应都经 after（互斥锁保证只触发一次）
        try{ Notification.requestPermission(function(p){ clearTimeout(tm); after(p); }); }catch(_){}
        try{
          const p=Notification.requestPermission();
          if(p&&typeof p.then==="function"){
            p.then(p2=>{ clearTimeout(tm); after(p2); })
             .catch(()=>{ clearTimeout(tm); if(done)return; done=true;
               try{showToast("通知请求失败，请在浏览器设置里把本网址加入「允许」列表");}catch(_){}
             });
          }
        }catch(_){}
      }catch(e){
        try{showToast("通知请求失败："+(e&&e.message||e));}catch(_){}
      }
    };
    $("#notifyBannerClose").onclick=()=>{ b.classList.remove("show"); };
  }catch(_){}
}
function ensureNotifyPermission(){ initNotifyBanner(); }

let nextReminderTimer=null;
function scheduleNextReminder(){
  if(nextReminderTimer){clearTimeout(nextReminderTimer);nextReminderTimer=null;}
  const now=Date.now();
  const today=dateOnly(now);
  let nextTime=Infinity;
  state.events.forEach(e=>{
    if(!Array.isArray(e.reminders)||e.reminders.length===0)return;
    const consider=startMs=>{
      if(now-startMs>DAY)return;
      e.reminders.forEach(mins=>{
        const triggerAt=startMs-mins*60000;
        const key=e.id+"_"+mins+"_"+dateOnly(startMs);
        if(state.notified[key])return;
        if(triggerAt>now && triggerAt<nextTime)nextTime=triggerAt;
      });
    };
    if(evRepeat(e).type==="none"){
      if(now-(e.end||e.start)>DAY)return;
      consider(e.start);
    }else{
      for(let off=-1;off<=2;off++){
        const t=addDays(today,off);
        if(occursOn(e,t)){const o=occurrenceTimes(e,t);consider(o.start);}
      }
    }
  });
  if(nextTime!==Infinity){
    const delay=Math.max(0,nextTime-now);
    nextReminderTimer=setTimeout(()=>{checkReminders();scheduleNextReminder();},delay);
    console.log("[提醒] 精确调度下次提醒，"+Math.round(delay/1000)+" 秒后触发");
  }
}
function checkReminders(){
  const now=Date.now();
  let changed=false;
  const today=dateOnly(now);
  state.events.forEach(e=>{
    if(!Array.isArray(e.reminders)||e.reminders.length===0)return;
    const fire=startMs=>{
      if(now-startMs>DAY)return;
      e.reminders.forEach(mins=>{
        const triggerAt=startMs-mins*60000;
        const key=e.id+"_"+mins+"_"+dateOnly(startMs);
        if(state.notified[key]){
          console.log("[提醒] 已触发过，跳过",key,"事件:",e.title);
          return;
        }
        // 触发窗口：triggerAt 之后 24 小时内（页面打开晚了也能补提醒）
        if(now>=triggerAt && now<triggerAt+DAY){
          const o=occurrenceTimes(e,dateOnly(startMs));
          if(state.notified[key]){console.log("[提醒] 并发重入，跳过",key);return;}
          console.log("[提醒] 触发",e.title,"id="+e.id,"提前",mins,"分","late=",Math.max(0,now-triggerAt),"ms");
          fireReminder(Object.assign({},e,{start:o.start,end:o.end}),mins,Math.max(0,now-triggerAt));
          state.notified[key]=Date.now();
          changed=true;
        }
      });
    };
    if(evRepeat(e).type==="none"){
      if(now-(e.end||e.start)>DAY)return;
      fire(e.start);
    }else{
      for(let off=-1;off<=1;off++){
        const t=addDays(today,off);
        if(occursOn(e,t)){
          // 用该日期实际发生时间（而非日期零点）计算 triggerAt，否则 14:04 的提醒会按 00:00 触发
          const o=occurrenceTimes(e,t);
          fire(o.start);
        }
      }
    }
  });
  Object.keys(state.notified).forEach(k=>{
    if(Date.now()-state.notified[k]>2*DAY){delete state.notified[k];changed=true;}
  });
  if(changed)save();
  scheduleNextReminder();
}

/* ============ 拖拽 / 缩放 ============ */
let suppressClick=false;
let dragging=false;
view.addEventListener("mousedown",e=>{
  const rg=e.target.closest(".rgrip");
  const tEl=e.target.closest(".tevent");
  if(rg&&tEl){startResize(e,tEl);return;}
  if(tEl){startDragTime(e,tEl);return;}
  const mEl=e.target.closest(".event");
  if(mEl){startDragMonth(e,mEl);return;}
});
function startDragMonth(e,mEl){
  const id=mEl.dataset.id;const ev=getEvent(id);if(!ev)return;
  dragging=true;
  const sx=e.clientX,sy=e.clientY;let moved=false,clone=null;
  const move=ev2=>{
    const dx=ev2.clientX-sx,dy=ev2.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>3){moved=true;mEl.classList.add("dragging");clone=mEl.cloneNode(true);clone.className="dragclone";clone.style.setProperty("--c",catColor(ev.cat));document.body.appendChild(clone);}
    if(moved){clone.style.left=(ev2.clientX-20)+"px";clone.style.top=(ev2.clientY-12)+"px";}
  };
  const up=ev2=>{
    document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    dragging=false;suppressClick=true;setTimeout(()=>{suppressClick=false;},300);
    if(!moved){openEvent(id);return;}
    if(clone)clone.remove();mEl.classList.remove("dragging");
    const under=document.elementFromPoint(ev2.clientX,ev2.clientY);
    const cell=under&&under.closest(".cell");
    if(cell){const target=+cell.dataset.date;const diff=Math.round((target-dateOnly(ev.start))/DAY);
      ev.start=addDays(ev.start,diff);ev.end=addDays(ev.end,diff);save();render();}
    else render();
  };
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
}
function startDragTime(e,tEl){
  const id=tEl.dataset.id;const ev=getEvent(id);if(!ev)return;
  dragging=true;
  const sx=e.clientX,sy=e.clientY;const oS=ev.start,oE=ev.end;let moved=false;
  const move=ev2=>{
    const dy=ev2.clientY-sy;
    if(!moved&&Math.abs(dy)>3)moved=true;
    if(moved){
      const under=document.elementFromPoint(ev2.clientX,ev2.clientY);
      const col=under&&under.closest(".daycol");
      const dayDiff=col?Math.round((+col.dataset.date-dateOnly(oS))/DAY):0;
      let dmin=Math.round(dy/PXPERMIN/15)*15;
      ev.start=addDays(oS,dayDiff)+dmin*60000;
      ev.end=addDays(oE,dayDiff)+dmin*60000;
      render();
    }
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    dragging=false;suppressClick=true;setTimeout(()=>{suppressClick=false;},300);
    if(moved){save();render();}else{openEvent(id);}
  };
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
}
function startResize(e,tEl){
  const id=tEl.dataset.id;const ev=getEvent(id);if(!ev)return;
  dragging=true;
  const sy=e.clientY;const oE=ev.end;let moved=false;
  const move=ev2=>{
    const dy=ev2.clientY-sy;
    if(Math.abs(dy)>3)moved=true;
    if(moved){
      let dmin=Math.round(dy/PXPERMIN/15)*15;
      ev.end=oE+dmin*60000;
      if(ev.end<ev.start)ev.end=ev.start;
      render();
    }
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    dragging=false;suppressClick=true;setTimeout(()=>{suppressClick=false;},300);
    if(moved){save();render();}
  };
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
}

/* ============ 拖动排序（习惯热力图 / 速记卡片） ============ */
function reorderArr(arr,key,fromId,toId){
  const fi=arr.findIndex(x=>x[key]===fromId);
  const ti=arr.findIndex(x=>x[key]===toId);
  if(fi<0||ti<0||fi===ti)return;
  const [it]=arr.splice(fi,1);
  arr.splice(ti,0,it);
}
let _dragKind=null,_dragId=null;
view.addEventListener("dragstart",e=>{
  const hc=e.target.closest(".hm-card");
  if(hc&&state.module==="heatmap"){_dragKind="habit";_dragId=hc.dataset.habit;hc.classList.add("dragging");e.dataTransfer.effectAllowed="move";return;}
  const nc=e.target.closest(".note-card");
  if(nc&&state.module==="notes"){_dragKind="note";_dragId=nc.dataset.id;nc.classList.add("dragging");e.dataTransfer.effectAllowed="move";return;}
});
view.addEventListener("dragend",e=>{
  const c=e.target.closest(".hm-card,.note-card");if(c)c.classList.remove("dragging");
  _dragKind=null;_dragId=null;
});
view.addEventListener("dragover",e=>{
  if(!_dragKind)return;
  const sel=_dragKind==="habit"?".hm-card":".note-card";
  const tgt=e.target.closest(sel);
  if(!tgt||tgt.dataset[_dragKind==="habit"?"habit":"id"]===_dragId)return;
  e.preventDefault();
  e.dataTransfer.dropEffect="move";
});
view.addEventListener("drop",e=>{
  if(!_dragKind)return;
  const sel=_dragKind==="habit"?".hm-card":".note-card";
  const tgt=e.target.closest(sel);
  if(!tgt)return;
  e.preventDefault();
  const tid=tgt.dataset[_dragKind==="habit"?"habit":"id"];
  if(tid===_dragId)return;
  if(_dragKind==="habit")reorderArr(state.habits,"id",_dragId,tid);
  else reorderArr(state.quicknotes,"id",_dragId,tid);
  save();render();
});
