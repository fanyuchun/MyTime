/* ============ 侧栏交互 ============ */
$("#mcGrid").addEventListener("click",e=>{
  const c=e.target.closest(".mc-cell");
  if(c){state.cursor=+c.dataset.date;if(state.view==="month")render();else{state.view="day";render();}}
});
$("#mcPrev").onclick=()=>{state.cursor=addMonths(state.cursor,-1);render();};
$("#mcNext").onclick=()=>{state.cursor=addMonths(state.cursor,1);render();};
$("#catList").addEventListener("click",e=>{
  const del=e.target.closest(".del-cat");
  if(del){deleteCategory(del.dataset.del);return;}
  const it=e.target.closest(".catitem");if(!it)return;
  const id=it.dataset.cat;
  if(state.hiddenCats.has(id))state.hiddenCats.delete(id);else state.hiddenCats.add(id);
  render();
});
$("#habitList").addEventListener("click",e=>{
  const it=e.target.closest(".catitem");if(!it)return;
  const h=state.habits.find(x=>x.id===it.dataset.habit);
  if(h)openHabitModal(h);
});
$("#boardList").addEventListener("click",e=>{
  const del=e.target.closest(".del");
  if(del){kbDeleteCategory(del.dataset.delCat);return;}
  const head=e.target.closest(".kb-cat-head");
  if(head){
    const cid=head.dataset.cat;
    // 点「未选中」的分类：选中它并展开（作为新看板的目标夹）
    // 点「已选中」的分类：折叠 / 展开切换
    if(state.kanban.curCat!==cid){
      state.kanban.curCat=cid;
      if(!window._kbCollapsed)window._kbCollapsed={};
      window._kbCollapsed[cid]=false;
    }else{
      window._kbCollapsed[cid]=!window._kbCollapsed[cid];
    }
    save();renderKanbanSidebar();
    return;
  }
  const it=e.target.closest(".catitem");if(!it)return;
  state.kanban.cur=it.dataset.board;
  const bb=state.kanban.boards.find(x=>x.id===it.dataset.board);
  if(bb)state.kanban.curCat=bb.categoryId;
  save();renderKanban();
});

/* 模块切换 + 习惯 CRUD */
$("#modSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button");if(b)setModule(b.dataset.mod);
});
$("#addHabit").onclick=()=>openHabitModal();
$("#newHabitBtn").onclick=()=>openHabitModal();
$("#addCategorySide").onclick=kbAddCategory;
$("#newBoardBtn").onclick=kbAddBoard;
$("#habitSaveBtn").onclick=saveHabit;
$("#habitCancelBtn").onclick=closeHabitModal;
$("#habitDeleteBtn").onclick=()=>{if(editingHabitId)deleteHabit(editingHabitId);};
$("#fHabitColor").addEventListener("input",()=>{
  const c=$("#fHabitColor").value;
  $("#fHabitColor").dataset.hc=shadeColor(c,-25);
  updateHeatRamp();
});
$("#habitOverlay").addEventListener("click",e=>{if(e.target.id==="habitOverlay")closeHabitModal();});
$("#fHabitName").addEventListener("keydown",e=>{if(e.key==="Enter")saveHabit();});

/* ============ 顶栏交互 ============ */
$("#viewSwitch").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.v);});
$("#prevBtn").onclick=()=>nav(-1);
$("#nextBtn").onclick=()=>nav(1);
$("#todayBtn").onclick=()=>{
  if(state.module==="heatmap"){state.habitYear=new Date().getFullYear();render();}
  else{state.cursor=Date.now();render();}
};
$("#newBtn").onclick=()=>newEventAt(dateOnly(state.cursor),9*60);
$("#menuBtn").onclick=()=>document.body.classList.toggle("side-open");
$("#searchInput").addEventListener("input",e=>{state.search=e.target.value;render();});
$("#themeBtn").onclick=()=>{state.theme=state.theme==="light"?"dark":"light";render();};

/* 模态交互 */
$("#saveBtn").onclick=saveEvent;
$("#cancelBtn").onclick=closeModal;
$("#deleteBtn").onclick=deleteEvent;
$("#catPick").addEventListener("click",e=>{const c=e.target.closest(".cp");if(c){modalCat=c.dataset.cat;renderCatPick();}});
$("#fAllDay").addEventListener("change",e=>{
  const dis=e.target.checked;
  $("#fStartTime").disabled=dis;$("#fEndTime").disabled=dis;
});
$("#modalOverlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal();});
$("#fRepeat").addEventListener("change",()=>{
  const custom=$("#fRepeat").value==="custom";
  $("#fRepeatCustomRow").style.display=custom?"":"none";
  updateRepeatHint(fromInputs($("#fStartDate").value,$("#fStartTime").value||"00:00"),currentRepeatData());
});
$("#fStartDate").addEventListener("change",()=>{
  renderRepeatPick(fromInputs($("#fStartDate").value,$("#fStartTime").value||"00:00"),currentRepeatData());
});

/* 速记模态交互 */
$("#noteSave").onclick=qnSave;
$("#noteCancel").onclick=qnCloseModal;
$("#noteOverlay").addEventListener("click",e=>{if(e.target.id==="noteOverlay")qnCloseModal();});
$("#fNoteText").addEventListener("input",()=>{$("#noteCharCount").textContent=$("#fNoteText").value.length+"/400";});
$("#fNoteTitle").addEventListener("keydown",e=>{if(e.key==="Enter"){$("#fNoteText").focus();}});

/* 列表弹窗 */
$("#listClose").onclick=()=>$("#listOverlay").classList.remove("show");
$("#listOverlay").addEventListener("click",e=>{
  if(e.target.id==="listOverlay"){$("#listOverlay").classList.remove("show");return;}
  const it=e.target.closest(".ag-item");
  if(it&&it.dataset.id){$("#listOverlay").classList.remove("show");openEvent(it.dataset.id);}
});

/* 导入 / 导出 */
$("#exportBtn").onclick=()=>{
  const data={version:1,savedAt:Date.now(),exportedAt:Date.now(),events:state.events,cats:state.cats,hiddenCats:[...state.hiddenCats],habits:state.habits,logs:state.logs,habitYear:state.habitYear,kanban:state.kanban,quicknotes:state.quicknotes};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="mytime-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
};
$("#importBtn").onclick=()=>$("#fileInput").click();
$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!confirm("导入将覆盖当前所有事件、分类、习惯与速记记录，确定继续？")){e.target.value="";return;}
      state.events=Array.isArray(d.events)?d.events:[];
      if(Array.isArray(d.cats)&&d.cats.length)state.cats=d.cats;
      state.hiddenCats=new Set(d.hiddenCats||[]);
      if(Array.isArray(d.habits))state.habits=d.habits;
      if(d.logs&&typeof d.logs==="object")state.logs=d.logs;
      if(d.habitYear)state.habitYear=d.habitYear;
      if(d.kanban&&Array.isArray(d.kanban.boards))state.kanban=d.kanban;
      if(Array.isArray(d.quicknotes))state.quicknotes=d.quicknotes;
      kbInit();qnInit();
      save();render();
      showToast("已导入 "+state.events.length+" 个事件、 "+state.quicknotes.length+" 条速记");
    }catch(err){alert("导入失败：文件格式不正确");}
    e.target.value="";
  };
  r.readAsText(f);
});

/* 新建分类 */
$("#addCat").onclick=()=>{
  const name=prompt("新分类名称：");
  if(!name)return;
  const used=state.cats.map(c=>c.color);
  const color=CAT_PALETTE.find(c=>!used.includes(c))||CAT_PALETTE[state.cats.length%CAT_PALETTE.length];
  state.cats.push({id:uid(),name,color});
  render();
};
function deleteCategory(id){
  if(state.cats.length<=1){alert("至少保留一个分类，无法删除。");return;}
  const cat=state.cats.find(c=>c.id===id);if(!cat)return;
  const count=state.events.filter(e=>e.cat===id).length;
  const fallback=state.cats.find(c=>c.id!==id).id;
  const msg=count>0
    ? `确定删除分类「${cat.name}」？该分类下的 ${count} 个事件将转移到「${state.cats.find(c=>c.id===fallback).name}」。`
    : `确定删除分类「${cat.name}」？`;
  if(!confirm(msg))return;
  state.cats=state.cats.filter(c=>c.id!==id);
  state.hiddenCats.delete(id);
  state.events.forEach(e=>{if(e.cat===id)e.cat=fallback;});
  if(modalCat===id)modalCat=fallback;
  render();
}

/* 帮助层 */
function toggleHelp(){$("#helpOverlay").classList.toggle("show");}
$("#helpBtn").onclick=toggleHelp;
$("#helpClose").onclick=()=>$("#helpOverlay").classList.remove("show");
$("#helpOverlay").addEventListener("click",e=>{if(e.target.id==="helpOverlay")$("#helpOverlay").classList.remove("show");});

/* 快捷键 */
document.addEventListener("keydown",e=>{
  if($("#modalOverlay").classList.contains("show")||$("#helpOverlay").classList.contains("show")||$("#listOverlay").classList.contains("show")||$("#habitOverlay").classList.contains("show")||$("#noteOverlay").classList.contains("show")){
    if(e.key==="Escape"){closeModal();$("#helpOverlay").classList.remove("show");$("#listOverlay").classList.remove("show");closeHabitModal();qnCloseModal();}
    return;
  }
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  const k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"){nav(-1);return;}
  if(e.key==="ArrowRight"){nav(1);return;}
  if(e.key==="?"){toggleHelp();return;}
  if(k==="t"){
    if(state.module==="heatmap"){state.habitYear=new Date().getFullYear();render();}
    else{state.cursor=Date.now();render();}
    return;
  }
  if(state.module==="kanban"){
    if((e.ctrlKey||e.metaKey)&&k==="z"&&!e.shiftKey){e.preventDefault();kbUndo();return;}
    if((e.ctrlKey||e.metaKey)&&(k==="y"||(k==="z"&&e.shiftKey))){e.preventDefault();kbRedo();return;}
    return; // 看板模块不使用日历快捷键
  }
  if(state.module!=="calendar")return; // 以下快捷键仅日历模块生效
  if(k==="m")setView("month");
  else if(k==="w")setView("week");
  else if(k==="d")setView("day");
  else if(k==="y")setView("year");
  else if(k==="a")setView("agenda");
  else if(k==="c")newEventAt(dateOnly(state.cursor),9*60);
});

/* ============ 启动 ============ */
load();
// 云端配置：开源版默认留空，由用户填自己的 Supabase。已配置→直接同步；未配置→弹窗引导。

document.getElementById("cfgCancel").onclick=onCfgCancel;
document.getElementById("cloudCfgBtn").onclick=()=>showSetup(true);
if(loadCfg()){
  loadCloud();
  startCloudPoll();
}else{
  showSetup();
}
render();
initNotifyBanner();   // https/localhost 下显示「开启桌面通知」提示条（点击触发授权，比静默请求可靠）
checkReminders();
setInterval(checkReminders,10000);
scheduleNextReminder();
</script>
